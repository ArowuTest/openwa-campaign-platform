openapi: 3.1.0
info:
  title: Internal Audience & Campaign Control API
  version: 0.8.0
  description: >
    Internal-only API for organisation records, offline consent reviews, secure audience imports,
    governed cohort definitions and controlled campaign lifecycle management.
servers:
  - url: /api/v1
security:
  - internalSession: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an internal user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: MFA challenge or authenticated session }
        '401': { description: Credentials could not be verified }
        '429': { description: Account temporarily locked }
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete the login MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAVerificationRequest' }
      responses:
        '200': { description: Authenticated session created }
        '401': { description: MFA challenge invalid or expired }
  /auth/step-up:
    post:
      operationId: stepUpMFA
      summary: Refresh MFA assurance for the existing session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpRequest' }
      responses:
        '200': { description: Session MFA assurance refreshed }
        '401': { description: MFA code or session invalid }
  /auth/sessions:
    get:
      operationId: listActiveSessions
      summary: List the current user's active sessions
      responses:
        '200': { description: Active session list }
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllOwnSessions
      summary: Revoke every active session for the current user
      responses:
        '200': { description: All sessions revoked }
  /inbound-replies/{id}/content:
    get:
      operationId: getInboundReplyContent
      summary: Reveal retained inbound reply content under a separate permission
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Retained reply content and retention metadata }
        '410': { description: Content redacted under retention policy }
  /admin/inbound-replies/retention-sweep:
    post:
      operationId: runInboundReplyRetentionSweep
      summary: Redact expired inbound reply content while preserving fingerprints and metrics
      responses:
        '200': { description: Retention sweep result }
  /admin/inbound-retention-policies:
    get:
      operationId: listInboundRetentionPolicies
      summary: List governed effective-dated inbound content retention policies
      responses:
        '200': { description: Retention policy list }
    post:
      operationId: createInboundRetentionPolicy
      summary: Create a draft inbound content retention policy
      responses:
        '201': { description: Draft retention policy created }
  /admin/inbound-retention-policies/{id}/submit:
    post:
      operationId: submitInboundRetentionPolicy
      summary: Submit an inbound retention policy for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Retention policy awaiting approval }
  /admin/inbound-retention-policies/{id}/decision:
    post:
      operationId: decideInboundRetentionPolicy
      summary: Approve or reject a submitted inbound retention policy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Decision recorded }
  /admin/inbound-replies/reencrypt:
    post:
      operationId: reencryptInboundReplyContent
      summary: Schedule a resumable retained-content re-encryption run
      responses:
        '202': { description: Re-encryption run accepted }
  /admin/inbound-reencryption-runs:
    get:
      operationId: listInboundReencryptionRuns
      summary: List resumable inbound-content re-encryption runs
      responses:
        '200': { description: Re-encryption run list }
  /admin/inbound-reencryption-runs/{id}:
    get:
      operationId: getInboundReencryptionRun
      summary: Read one resumable inbound-content re-encryption run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Re-encryption run }
        '404': { description: Run not found }
  /admin/opt-out-policies:
    get:
      operationId: listOptOutPolicies
      summary: List governed effective-dated opt-out policies
      responses:
        '200': { description: Policy list }
    post:
      operationId: createOptOutPolicy
      summary: Create a draft exact-match opt-out policy
      responses:
        '201': { description: Draft policy created }
  /admin/opt-out-policies/{id}/submit:
    post:
      operationId: submitOptOutPolicy
      summary: Submit an opt-out policy for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Policy awaiting approval }
  /admin/opt-out-policies/{id}/decision:
    post:
      operationId: decideOptOutPolicy
      summary: Approve or reject a submitted opt-out policy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Decision recorded }
  /admin/users:
    get:
      operationId: listInternalUsers
      summary: List provisioned internal users
      responses:
        '200': { description: Internal user list }
    post:
      operationId: createInternalUser
      summary: Provision a named internal user
      description: Requires identity.admin permission and recent MFA step-up. Returns the TOTP secret once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInternalUser' }
      responses:
        '201': { description: Internal user provisioned }
        '403': { description: Recent MFA step-up required }
        '409': { description: Email already exists or last-super-admin protection }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{id}:
    put:
      operationId: updateInternalUser
      summary: Update roles, status and MFA policy for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInternalUser' }
      responses:
        '200': { description: Internal user updated }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict or last-super-admin protection }
  /admin/users/{id}/reset-credentials:
    post:
      operationId: resetInternalUserCredentials
      summary: Reset password and MFA enrolment and revoke active sessions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetInternalUserCredentials' }
      responses:
        '200': { description: Credentials reset; TOTP secret returned once }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict }
  /admin/users/{id}/unlock:
    post:
      operationId: unlockInternalUser
      summary: Clear failed-login lock state for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedAdministrationReason' }
      responses:
        '200': { description: Account unlocked }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict }
  /admin/users/{id}/revoke-sessions:
    post:
      operationId: revokeInternalUserSessions
      summary: Revoke every active session for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrationReason' }
      responses:
        '200': { description: Sessions revoked }
        '403': { description: Recent MFA step-up required }
  /internal/gateway/events:
    post:
      operationId: ingestSignedGatewayEvent
      summary: Ingest one signed provider delivery event
      description: >
        Gateway-only endpoint. The HMAC is calculated over "<unix timestamp>.<exact raw body>".
        Exact replays return the original ledger outcome; event-ID reuse with different evidence is rejected.
      security: []
      parameters:
        - name: X-Gateway-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,}$' }
        - name: X-Gateway-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../events/provider-message-event.schema.json' }
      responses:
        '200': { description: Event applied or accepted as an exact replay }
        '401': { description: Signature missing, invalid or outside the replay window }
        '409': { description: Event identifier reused with different evidence }
        '422': { $ref: '#/components/responses/ValidationError' }
  /internal/gateway/inbound:
    post:
      operationId: ingestSignedGatewayInboundMessage
      summary: Ingest one signed inbound reply and enforce recognised opt-outs
      description: >
        Gateway-only endpoint. The HMAC is calculated over "<unix timestamp>.<exact raw body>".
        The control plane resolves the contact from clientReference, applies exact configured STOP classification,
        and creates an idempotent global suppression without persisting non-opt-out message content.
      security: []
      parameters:
        - name: X-Gateway-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,}$' }
        - name: X-Gateway-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../events/provider-inbound-message.schema.json' }
      responses:
        '200': { description: Inbound message accepted; response states whether an opt-out was recognised }
        '401': { description: Signature missing, invalid or outside the replay window }
        '404': { description: Campaign recipient reference not found }
        '409': { description: Inbound event identifier reused with different evidence }
        '422': { $ref: '#/components/responses/ValidationError' }
  /filter-definitions:
    get:
      operationId: listFilterDefinitions
      summary: List active filter definitions available to the current user
      responses:
        '200':
          description: Active filter definitions
  /cohorts/validate:
    post:
      operationId: validateCohort
      summary: Validate a typed cohort definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterGroup' }
      responses:
        '200': { description: Valid definition }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cohorts/estimate:
    post:
      operationId: estimateCohort
      summary: Calculate the current eligible audience count for a governed cohort
      responses:
        '200': { description: Cohort estimate returned }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '422': { description: Cohort could not be estimated }
  /segments:
    get:
      operationId: listSegments
      summary: List saved governed audience segments
      responses:
        '200': { description: Segments returned }
    post:
      operationId: createSegment
      summary: Create a saved governed audience segment
      responses:
        '201': { description: Segment created }
        '422': { description: Segment rejected }
  /segments/{id}:
    get:
      operationId: getSegment
      summary: Get a saved audience segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Segment returned }
        '404': { description: Segment not found }
    put:
      operationId: updateSegment
      summary: Create a new version of a saved audience segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Segment updated }
        '409': { description: Optimistic version conflict }
  /segments/{id}/archive:
    post:
      operationId: archiveSegment
      summary: Archive a saved segment with recent MFA verification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Segment archived }
        '403': { description: MFA step-up required }
        '409': { description: Optimistic version conflict }
  /segments/{id}/versions:
    get:
      operationId: listSegmentVersions
      summary: List immutable versions of a saved audience segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Segment versions returned }
        '404': { description: Segment not found }
  /segments/{id}/clone:
    post:
      operationId: cloneSegment
      summary: Clone a saved audience segment into a new independently versioned definition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, reason]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                reason: { type: string, minLength: 8 }
      responses:
        '201': { description: Segment clone created }
        '404': { description: Source segment not found }
        '422': { description: Clone rejected }
  /segments/{id}/compare:
    get:
      operationId: compareSegmentVersions
      summary: Compare two immutable versions of a saved audience segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fromVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: toVersion, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Version comparison returned }
        '400': { description: Invalid version query }
        '404': { description: Segment not found }
        '422': { description: Comparison rejected }
  /cohorts/compile:
    post:
      operationId: compileCohort
      summary: Compile a validated cohort against mandatory consent and suppression rules
      description: Internal engineering endpoint. Production UIs must not expose generated SQL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileCohortRequest' }
      responses:
        '200': { description: Parameterised cohort query }
        '422': { $ref: '#/components/responses/ValidationError' }
  /geography/countries:
    get:
      operationId: listCountries
      summary: List configured countries
      responses:
        '200': { description: Country catalogue }
  /geography/areas:
    get:
      operationId: listAdministrativeAreas
      summary: List states, regions, LGAs or other administrative areas
      parameters:
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: parent, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: integer, minimum: 1, maximum: 4 } }
      responses:
        '200': { description: Administrative areas }
  /organisations:
    get:
      operationId: listOrganisations
      summary: List internal organisation records
      responses:
        '200': { description: Organisation list }
    post:
      operationId: createOrganisation
      summary: Create an internal organisation record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganisation' }
      responses:
        '201': { description: Organisation created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{id}:
    get:
      operationId: getOrganisation
      summary: Retrieve an internal organisation record
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Organisation record }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateOrganisation
      summary: Update an organisation using optimistic concurrency
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrganisation' }
      responses:
        '200': { description: Organisation updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Organisation version conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{id}/status:
    post:
      operationId: setOrganisationStatus
      summary: Govern an organisation lifecycle status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganisationStatusChange' }
      responses:
        '200': { description: Organisation status changed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Organisation version conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audience-import-conflicts/batch-resolve:
    post:
      operationId: resolveAudienceImportConflictsBatch
      summary: Atomically resolve up to 100 pending audience profile conflicts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [conflictId, resolution, reason, expectedVersion]
                    properties:
                      conflictId: { type: string }
                      resolution: { type: string, enum: [KEEP_EXISTING, USE_INCOMING] }
                      reason: { type: string, minLength: 8 }
                      expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Conflicts resolved atomically }
        '403': { description: MFA step-up required }
        '404': { description: A conflict was not found }
        '409': { description: A conflict changed or was no longer pending }
  /organisations/{id}/audience-source-trust:
    get:
      operationId: listAudienceSourceTrust
      summary: List governed source trust policies for an organisation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Source trust policies returned }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
  /organisations/{id}/audience-source-trust/{source}:
    put:
      operationId: upsertAudienceSourceTrust
      summary: Create or update a governed source trust policy with recent MFA
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: source, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trustLevel, reason, expectedVersion]
              properties:
                trustLevel: { type: integer, minimum: 0, maximum: 100 }
                reason: { type: string, minLength: 8 }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '200': { description: Source trust policy stored }
        '401': { description: Authentication required }
        '403': { description: Permission or MFA step-up required }
        '409': { description: Optimistic version conflict }
        '422': { description: Policy rejected }
  /organisations/{id}/events:
    get:
      operationId: listOrganisationEvents
      summary: List immutable organisation lifecycle events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Organisation event history }
        '404': { $ref: '#/components/responses/NotFound' }
  /consent-reviews:
    get:
      operationId: listConsentReviews
      summary: List offline consent reviews
      parameters:
        - { name: organisationId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Consent review list }
    post:
      operationId: createConsentReview
      summary: Record an offline consent review for compliance decision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConsentReview' }
      responses:
        '201': { description: Consent review created in pending state }
        '422': { $ref: '#/components/responses/ValidationError' }
  /consent-reviews/{id}/decision:
    post:
      operationId: decideConsentReview
      summary: Approve or reject a pending consent review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentReviewDecision' }
      responses:
        '200': { description: Decision recorded }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audience-imports/preview:
    post:
      operationId: previewAudienceImport
      summary: Validate a CSV audience file without persisting raw identifiers
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                defaultCountry: { type: string, default: NG }
                msisdnColumn: { type: string, default: msisdn }
                countryColumn: { type: string, default: country }
                stateColumn: { type: string, default: state }
                lgaColumn: { type: string, default: lga }
                ageColumn: { type: string, default: age }
                genderColumn: { type: string, default: gender }
      responses:
        '200':
          description: Aggregate preview and row-level issues; no raw MSISDNs
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List internal campaigns
      responses:
        '200': { description: Campaign list }
    post:
      operationId: createCampaign
      summary: Create a draft campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCampaign' }
      responses:
        '201': { description: Draft campaign created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns/{id}/transition:
    post:
      operationId: transitionCampaign
      summary: Apply a controlled campaign lifecycle transition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignTransition' }
      responses:
        '200': { description: Campaign transitioned }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns/{id}/material-amendment:
    post:
      operationId: amendCampaignMaterial
      summary: Replace material approved evidence and automatically invalidate downstream approvals
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignMaterialAmendment' }
      responses:
        '200': { description: Campaign amended and regressed to the required approval stage }
        '403': { description: Recent MFA step-up is required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Optimistic concurrency conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /campaigns/{id}/material-changes:
    get:
      operationId: listCampaignMaterialChanges
      summary: List immutable material-change and approval-invalidation evidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ordered material-change evidence }
        '404': { $ref: '#/components/responses/NotFound' }
  /inbound-replies:
    get:
      summary: List governed inbound replies for authorised operations users
      responses:
        '200':
          description: Inbound reply work queue
  /inbound-replies/{id}/review:
    post:
      summary: Classify and optionally escalate one inbound reply
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, classification]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                classification: { type: string, enum: [OPT_OUT, QUESTION, COMPLAINT, OTHER] }
                escalated: { type: boolean }
                escalationReason: { type: string }
      responses:
        '200':
          description: Updated inbound reply
  /inbound-replies/{id}/legal-hold:
    post:
      summary: Apply or release a governed legal hold on retained inbound content
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, legalHold, reason]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
