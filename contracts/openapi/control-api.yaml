          application/json:
            schema: { $ref: '#/components/schemas/DirectUploadPartRequest' }
      responses:
        '200':
          description: Direct part confirmed or exact replay converged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceUploadPartEnvelope' }
        '404': { description: Upload session not found }
        '409': { description: Direct transport unavailable, object absent, or immutable part evidence conflicts }
        '410': { description: Upload session expired }
        '422': { description: Part or session state is invalid }
