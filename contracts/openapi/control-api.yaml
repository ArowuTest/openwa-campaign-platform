      type: object
      additionalProperties: false
      required: [key, scopeType, value, reason]
      properties:
        key: { type: string, minLength: 3, maxLength: 120, description: Configuration key. SENDER.TRANSPORT_RECOVERY uses SenderTransportRecoveryConfiguration; GATEWAY.RUNTIME_HEALTH uses GatewayRuntimeHealthConfiguration. }
        scopeType: { type: string, enum: [PLATFORM, ENVIRONMENT, ORGANISATION, CAMPAIGN, PROVIDER, GATEWAY_POOL, SENDER_POOL, SENDER_SESSION] }
        scopeId: { type: string, maxLength: 200, description: Required for non-PLATFORM scopes; SENDER_SESSION uses the governed sender-session ID. }
        value: { type: object, additionalProperties: true, description: Configuration-key-specific JSON. Use SenderTransportRecoveryConfiguration for SENDER.TRANSPORT_RECOVERY and GatewayRuntimeHealthConfiguration for GATEWAY.RUNTIME_HEALTH. }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
    SenderTransportRecoveryConfiguration:
      type: object
      additionalProperties: false
      description: >
        Governed value for SENDER.TRANSPORT_RECOVERY. The most-specific approved configuration is frozen at sender-session start. If no governed value exists, the worker uses validated deployment/bootstrap recovery settings.
      required: [reconnectMode, reconnectMaxAttempts, reconnectBaseDelayMs, reconnectStabilityResetMs, watchdogProbeTimeoutMs, watchdogFailureThreshold, engineTeardownTimeoutMs]
      properties:
        reconnectMode: { type: string, enum: [UNBOUNDED, DISABLED, BOUNDED] }
        reconnectMaxAttempts: { type: integer, minimum: 0, maximum: 20, description: BOUNDED requires 1-20; UNBOUNDED and DISABLED require 0. }
        reconnectBaseDelayMs: { type: integer, format: int64, minimum: 1000, maximum: 300000 }
        reconnectStabilityResetMs: { type: integer, format: int64, minimum: 60000, maximum: 3600000 }
        watchdogProbeTimeoutMs: { type: integer, format: int64, minimum: 100, maximum: 60000 }
        watchdogFailureThreshold: { type: integer, minimum: 1, maximum: 10 }
        engineTeardownTimeoutMs: { type: integer, format: int64, minimum: 1000, maximum: 120000 }
    GatewayRuntimeHealthConfiguration:
      type: object
      additionalProperties: false
      description: Governed value for GATEWAY.RUNTIME_HEALTH. Controls when a missing gateway heartbeat is considered stale; deployment bootstrap is used only when no approved effective configuration exists.
