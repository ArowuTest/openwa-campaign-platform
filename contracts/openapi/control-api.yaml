      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Upload session returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceUploadSessionEnvelope' }
        '404': { description: Upload session not found }
