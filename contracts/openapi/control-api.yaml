  /campaigns/{id}/readiness:
    get:
      operationId: getCampaignReadiness
      summary: Read advisory preparation evidence for the saved campaign
      description: Requires campaign.read. Read-only evidence for DRAFT through FINAL_APPROVAL_PENDING. Uses only the persisted ID and saved version; no browser forecast, approval claim or counts are accepted. Does not approve, hold capacity, schedule, send or dispatch. Final approval revalidates current evidence. READY_FOR_FINAL_REVIEW does not establish competing-reservation or deadline feasibility.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Safe ordered readiness checks. Expected missing, pending and unavailable evidence is represented in checks.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignReadiness' }
        '400': { description: INVALID_CAMPAIGN_ID }
        '401': { description: AUTHENTICATION_REQUIRED or SESSION_INVALID }
        '403': { description: PERMISSION_DENIED }
        '404': { description: CAMPAIGN_NOT_FOUND }
        '409': { description: CAMPAIGN_VERSION_CONFLICT or CAMPAIGN_READINESS_STAGE_UNSUPPORTED. Reload changed detail or use existing execution evidence for scheduled and later stages. }
        '500': { description: INTERNAL_ERROR with no persistence or private source details }
        '503': { description: CAMPAIGN_READINESS_UNAVAILABLE for missing required query wiring }
  /campaigns/{id}/draft:
    put:
      operationId: saveCampaignDraft
      summary: Save governed editable DRAFT preparation fields
      description: Requires campaign.write and authenticated actor; cookie authentication requires CSRF. Accepts a strict full replacement JSON object at most 256 KiB. Organisation, purpose and consent-review IDs must equal the saved tuple. Current governance and exact frozen provider/gateway authority are checked. Incomplete schedules are allowed; omission or null clears dates. No-op still guards current version/state under the row lock and creates no event. Does not approve, release, create routing or dispatch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignDraftSaveRequest' }
      responses:
        '200':
          description: Saved CampaignDetail; version advances once only when editable fields changed
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignDetail' }
        '400': { description: INVALID_JSON or INVALID_CAMPAIGN_ID }
        '401': { description: Authentication required or invalid session }
        '403': { description: Permission denied or CSRF validation failed }
        '404': { description: CAMPAIGN_NOT_FOUND }
        '409': { description: CAMPAIGN_VERSION_CONFLICT, CAMPAIGN_DRAFT_NOT_EDITABLE or CAMPAIGN_DRAFT_REFERENCES_LOCKED. Preserve unsaved values and explicitly reconcile current server state. }
        '422': { description: CAMPAIGN_DRAFT_INVALID with safe field codes }
        '500': { description: INTERNAL_ERROR with no persistence details }
        '503': { description: CAMPAIGN_DRAFT_GOVERNANCE_UNAVAILABLE or campaign services unavailable }
