      properties:
        sessionId: { type: string, format: uuid }
        configured: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    SenderProxyConfigurationRequest:
      type: object
      additionalProperties: false
      required: [url, type, expectedVersion, reason]
      properties:
        url: { type: string, format: uri, writeOnly: true }
        type: { type: string, enum: [http, https, socks4, socks5] }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 8 }
    TransportSelectionRequest:
      type: object
      additionalProperties: false
      required:
        [channel, provider, engine, routingMode, gatewayPoolId, adapterVersion, fallbackMode, routingPolicyVersion, capacityEvidenceVersion]
      properties:
        channel: { type: string, enum: [WHATSAPP] }
        provider: { type: string, enum: [OPENWA] }
        engine: { type: string, enum: [WHATSAPP_WEB_JS, BAILEYS] }
        routingMode: { type: string, enum: [SPECIFIC_SESSION, SENDER_POOL] }
        gatewayPoolId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        senderPoolId: { type: string, format: uuid }
        adapterVersion: { type: string, minLength: 1, maxLength: 100 }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [SEND_TEXT, SEND_IMAGE, SEND_VIDEO, SEND_DOCUMENT, DELIVERY_EVENTS, READ_EVENTS, INBOUND_MESSAGES]
        fallbackMode: { type: string, enum: [NONE] }
        routingPolicyVersion: { type: string, minLength: 1, maxLength: 100 }
        capacityEvidenceVersion: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { routingMode: { const: SPECIFIC_SESSION } }
          then:
            required: [sessionId]
            not: { required: [senderPoolId] }
        - if:
            properties: { routingMode: { const: SENDER_POOL } }
          then:
            required: [senderPoolId]
            not: { required: [sessionId] }
    CreateCampaign:
      type: object
      additionalProperties: false
      required:
        [organisationId, name, purposeId, consentReviewId, maximumUniqueRecipients, transport]
      properties:
        organisationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 250 }
        purposeId: { type: string, format: uuid }
        consentReviewId: { type: string, format: uuid }
        requestedStartAt: { type: string, format: date-time }
        completionDeadlineAt: { type: string, format: date-time }
        timezone: { type: string, default: UTC }
        quietHoursStart: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        quietHoursEnd: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        maximumUniqueRecipients: { type: integer, format: int64, minimum: 1 }
        maximumMessagesPerRecipient: { type: integer, enum: [1], default: 1 }
        senderPool: { type: string, description: Legacy display label; governed routing uses transport.senderPoolId. }
        transport: { $ref: '#/components/schemas/TransportSelectionRequest' }
    CampaignDraftSaveRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, name, organisationId, purposeId, consentReviewId, maximumUniqueRecipients, maximumMessagesPerRecipient, timezone, transport]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 8, maxLength: 1000, description: Trimmed operator reason. }
        name: { type: string, minLength: 1, maxLength: 250, pattern: '\S' }
        organisationId: { type: string, format: uuid, description: Locked saved organisation ID. }
        purposeId: { type: string, format: uuid, description: Locked saved purpose ID. }
        consentReviewId: { type: string, format: uuid, description: Locked saved review ID. }
        maximumUniqueRecipients: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        maximumMessagesPerRecipient: { type: integer, const: 1 }
        requestedStartAt: { type: [string, "null"], format: date-time, description: UTC instant; omission or null clears. }
        completionDeadlineAt: { type: [string, "null"], format: date-time, description: UTC instant; if both dates supplied must be later than start. Omission or null clears. }
        timezone: { type: string, minLength: 1, description: Valid IANA timezone; does not reinterpret stored UTC instants. }
        quietHoursStart: { type: string, pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Paired with quietHoursEnd; omission or empty clears both. }
        quietHoursEnd: { type: string, pattern: '^$|^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Paired with quietHoursStart and must be unequal. }
        transport: { $ref: '#/components/schemas/DraftTransportRequest' }
    DraftTransportRequest:
      type: object
      additionalProperties: false
      required: [channel, provider, engine, routingMode, gatewayPoolId, senderPoolId, adapterVersion, routingPolicyVersion, capacityEvidenceVersion, fallbackMode, requiredCapabilities]
      properties:
        channel: { type: string, const: WHATSAPP }
        provider: { type: string, const: OPENWA }
        engine: { type: string, enum: [WHATSAPP_WEB_JS, BAILEYS] }
        routingMode: { type: string, const: SENDER_POOL }
        gatewayPoolId: { type: string, format: uuid }
        senderPoolId: { type: string, format: uuid }
        adapterVersion: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        routingPolicyVersion: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        capacityEvidenceVersion: { type: string, minLength: 1, maxLength: 100, pattern: '\S' }
        fallbackMode: { type: string, const: NONE }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [SEND_TEXT, SEND_TEMPLATE, SEND_IMAGE, SEND_VIDEO, SEND_DOCUMENT, DELIVERY_EVENTS, READ_EVENTS, INBOUND_MESSAGES, PAIRING_QR, PAIRING_CODE] }
    CampaignReadiness:
      type: object
      additionalProperties: false
      required: ["campaignId","campaignVersion","campaignStatus","assessedAt","state","readyForFinalReview","checks","limitations"]
      properties:
        campaignId: {"type":"string","format":"uuid"}
        campaignVersion: {"type":"integer","format":"int64","minimum":1,"maximum":9007199254740991}
        campaignStatus: {"type":"string","enum":["DRAFT","CONSENT_REVIEW_PENDING","CONSENT_APPROVED","AUDIENCE_BUILDING","AUDIENCE_VALIDATED","MESSAGE_REVIEW_PENDING","MESSAGE_APPROVED","COMMERCIAL_APPROVED","FINAL_APPROVAL_PENDING"]}
        assessedAt: {"type":"string","format":"date-time","description":"UTC ISO 8601 instant."}
        effectiveStartAt: {"type":"string","format":"date-time","description":"UTC ISO 8601 instant."}
        state: {"type":"string","enum":["BLOCKED","REQUIRES_REVIEW","READY_FOR_FINAL_REVIEW"]}
        readyForFinalReview: {"type":"boolean","description":"Derived only from state; grants no approval or dispatch authority."}
        checks: {"type":"array","minItems":12,"maxItems":12,"items":{"$ref":"#/components/schemas/ReadinessCheck"}}
        capacity: {"$ref":"#/components/schemas/CapacityPreview"}
        limitations: {"type":"array","minItems":1,"items":{"type":"string","minLength":1}}
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: ["key","status","code","message","remediation","evidence"]
      properties:
        key: {"type":"string","enum":["organisation","purpose","consent","audience","message","transport","schedule","capacity","pilot","commercial","maintenance","finalReview"]}
        status: {"type":"string","enum":["PASS","BLOCKED","PENDING_REVIEW","UNAVAILABLE","NOT_APPLICABLE"]}
        code: {"type":"string","minLength":1}
