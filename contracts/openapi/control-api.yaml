      responses:
        '200': { description: Contact lifecycle status }
        '404': { description: Contact not found }
    post:
      operationId: transitionContactLifecycle
      summary: Apply an MFA-protected and optimistically locked contact lifecycle transition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, processingRestricted, expectedVersion, reason]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE, SUPPRESSED, INVALID, RECYCLED, DECEASED] }
                processingRestricted: { type: boolean }
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 12 }
      responses:
        '200': { description: Lifecycle transition recorded }
        '403': { description: Permission or MFA step-up required }
        '404': { description: Contact not found }
        '409': { description: Version conflict or immutable privacy state }
        '422': { description: Invalid lifecycle transition }
