name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-web/package-lock.json
            services/openwa-gateway/package-lock.json
      - run: npm ci --include=dev --prefix apps/admin-web
      - run: npm ci --include=dev --prefix services/openwa-gateway
      - name: Admin web typecheck
        run: npm run typecheck --prefix apps/admin-web
      - name: Admin web lint
        run: npm run lint --prefix apps/admin-web
      - name: Admin web tests
        run: npm run test --prefix apps/admin-web
      - name: Admin web dependency audit
        run: npm audit --audit-level=moderate --package-lock-only --prefix apps/admin-web
      - name: Gateway dependency audit
        run: npm audit --audit-level=moderate --package-lock-only --prefix services/openwa-gateway --workspaces=false
      - run: ./scripts/check.sh

  postgres-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaign_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - name: Install native PostgreSQL client dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev pkg-config postgresql-client
      - name: Verify cgo PostgreSQL driver
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/persistence/database/libpqdriver | tee driver.log
          grep -F -- '--- PASS: TestDriverIsRegistered' driver.log
      - name: Establish service roles and default privileges
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: campaign_platform
        run: psql -v ON_ERROR_STOP=1 -f database/bootstrap/002_service_roles.sql
      - name: Replay ordered migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          python3 scripts/validate-postgres-migrations.py | tee migration.log
      - name: Reconcile service privileges after migrations
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: campaign_platform
        run: psql -v ON_ERROR_STOP=1 -f database/bootstrap/002_service_roles.sql
      - name: Verify commercial schema readiness and append-only history
        env:
          CGO_ENABLED: '1'
          POSTGRES_META_CLOUD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
          POSTGRES_COMMERCIAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./cmd/control-api -run '^TestControlSchemaReadinessRejectsMissingCommercialEvidence$' | tee readiness.log
          grep -F -- '--- PASS: TestControlSchemaReadinessRejectsMissingCommercialEvidence' readiness.log
          go test -count=1 -v ./internal/persistence/postgres -run '^TestPostgreSQLCommercialEventsAreAtomicOrderedAndAppendOnly$' | tee commercial.log
          grep -F -- '--- PASS: TestPostgreSQLCommercialEventsAreAtomicOrderedAndAppendOnly' commercial.log
      - name: Verify identity administration role catalogue and lifecycle
        env:
          CGO_ENABLED: '1'
          POSTGRES_IDENTITY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/persistence/postgres -run '^TestPostgreSQLIdentityMFAVisibleSessionsAndImmediateAdminRevocation$' | tee identity.log
          grep -F -- '--- PASS: TestPostgreSQLIdentityMFAVisibleSessionsAndImmediateAdminRevocation' identity.log
      - name: Verify approval-time authentication export snapshot
        env:
          CGO_ENABLED: '1'
          POSTGRES_PAGINATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/operations -run '^TestPostgreSQLAuthenticationExportSnapshotExcludesLateCommitsAndMutation$' | tee snapshot.log
          grep -F -- '--- PASS: TestPostgreSQLAuthenticationExportSnapshotExcludesLateCommitsAndMutation' snapshot.log
      - name: Verify privacy export payload persistence through approval
        env:
          CGO_ENABLED: '1'
          POSTGRES_PAGINATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/operations -run '^TestPostgreSQLPrivacyExportCreatePreservesEncryptedPayloadThroughApproval$' | tee privacy-persistence.log
          grep -F -- '--- PASS: TestPostgreSQLPrivacyExportCreatePreservesEncryptedPayloadThroughApproval' privacy-persistence.log
      - name: Verify export worker privileges and upgrade reconciliation
        env:
          CGO_ENABLED: '1'
          POSTGRES_EXPORT_ROLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/operations -run '^TestPostgreSQLExportWorker(ServiceRoleLifecycle|ServiceRoleLeastPrivilege|PrivilegeUpgrade|StatusTransitionGuard)$' | tee privileges.log
          grep -F -- '--- PASS: TestPostgreSQLExportWorkerServiceRoleLifecycle' privileges.log
          grep -F -- '--- PASS: TestPostgreSQLExportWorkerServiceRoleLeastPrivilege' privileges.log
          grep -F -- '--- PASS: TestPostgreSQLExportWorkerPrivilegeUpgrade' privileges.log
          grep -F -- '--- PASS: TestPostgreSQLExportWorkerStatusTransitionGuard' privileges.log
      - name: Run PostgreSQL adversarial smoke
        env:
          CGO_ENABLED: '1'
          POSTGRES_ADVERSARIAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campaign_platform?sslmode=disable
        run: |
          set -o pipefail
          go test -count=1 -v ./tests/integration -run '^TestPostgresAdversarialConcurrency$' | tee adversarial.log
          grep -F -- '--- PASS: TestPostgresAdversarialConcurrency' adversarial.log
