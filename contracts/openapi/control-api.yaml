        - { name: part, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 1024 } }
        - name: X-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Part accepted or exact replay converged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceUploadPartEnvelope' }
        '404': { description: Upload session not found }
        '409': { description: Part conflicts with immutable evidence already recorded }
        '410': { description: Upload session expired }
        '413': { description: Part exceeds the server-declared size }
        '422': { description: Part or session state is invalid }
