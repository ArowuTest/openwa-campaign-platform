        unknownOutcomes: { type: integer, format: int64, minimum: 0 }
        queueDepth: { type: integer, format: int64, minimum: 0 }
        oldestQueuedAt: { type: string, format: date-time }
        staleWorkerNodes: { type: integer, format: int64, minimum: 0 }
