  /operations/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeGovernedOperationalAlert
      summary: Acknowledge an active alert and stop further escalation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Alert acknowledged }
  /operations/alerts/{id}/events:
    get:
      operationId: listGovernedOperationalAlertEvents
      summary: List immutable alert lifecycle and escalation events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Alert event history }
  /operations/notifications:
    get:
      operationId: listOperationalNotifications
      summary: List operational portal and future transport-neutral notifications
      responses:
        '200': { description: Operational-notification list }
  /operations/incidents/{id}/timeline:
    get:
      operationId: getOperationalIncidentTimeline
      summary: Get the append-only operational incident timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Incident timeline }

components:
  securitySchemes:
    internalSession:
      type: apiKey
      in: cookie
      name: campaign_session
  responses:
    ValidationError:
      description: Request failed domain or validation rules
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Requested record does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    VersionedReason:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 5 }
    OrganisationPolicyDraft:
      type: object
      required: [contactRetentionDays, campaignRetentionDays, effectiveFrom, reason]
      properties:
        allowedPurposeIds:
          type: array
          items: { type: string }
        prohibitedPurposeIds:
          type: array
          items: { type: string }
        frequencyCaps:
          type: array
          items:
            type: object
            required: [channel, maxMessages, windowHours]
            properties:
              purposeId: { type: string, maxLength: 128 }
              channel: { type: string, maxLength: 32, example: WHATSAPP }
              maxMessages: { type: integer, minimum: 1, maximum: 10000 }
              windowHours: { type: integer, minimum: 1, maximum: 8760 }
        contactRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        campaignRetentionDays: { type: integer, minimum: 30, maximum: 3650 }
        reportBrandName: { type: string, maxLength: 160 }
        reportFooter: { type: string, maxLength: 500 }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, minLength: 5 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    MFAVerificationRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string, minLength: 16 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    StepUpRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    InternalUserAccount:
      type: object
      required: [id, email, displayName, status, mfaRequired, roleCodes, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [INVITED, ACTIVE, SUSPENDED, DISABLED] }
        mfaRequired: { type: boolean }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        version: { type: integer, format: int64, minimum: 1 }
        lastLoginAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateInternalUser:
      type: object
      required: [email, displayName, temporaryPassword, roleCodes, reason]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 2, maxLength: 200 }
        temporaryPassword: { type: string, minLength: 20 }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        reason: { type: string, minLength: 5, maxLength: 500 }
    UpdateInternalUser:
      type: object
      required: [displayName, status, roleCodes, mfaRequired, expectedVersion, reason]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 200 }
        status: { type: string, enum: [INVITED, ACTIVE, SUSPENDED, DISABLED] }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        mfaRequired: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    ResetInternalUserCredentials:
      type: object
      required: [temporaryPassword, expectedVersion, reason]
      properties:
        temporaryPassword: { type: string, minLength: 20 }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    VersionedAdministrationReason:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    AdministrationReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    FilterRule:
      type: object
      required: [definitionCode, operator, values]
      properties:
        definitionCode: { type: string }
        operator: { type: string }
        values: { type: array, items: {} }
    FilterGroup:
      type: object
      required: [join]
      properties:
        join: { type: string, enum: [AND, OR] }
        rules:
          type: array
          items: { $ref: '#/components/schemas/FilterRule' }
        children:
          type: array
          items: { $ref: '#/components/schemas/FilterGroup' }
    CompileCohortRequest:
      type: object
      required: [definition, organisationId, purposeId]
      properties:
        definition: { $ref: '#/components/schemas/FilterGroup' }
        organisationId: { type: string, format: uuid }
        purposeId: { type: string, format: uuid }
        channel: { type: string, default: WHATSAPP }
        asOf: { type: string, format: date-time }
    CreateOrganisation:
      type: object
      required: [legalName]
      properties:
        legalName: { type: string, minLength: 1 }
        tradingName: { type: string }
        countryISO2: { type: string, minLength: 2, maxLength: 2 }
        primaryContactName: { type: string }
        primaryContactEmail: { type: string, format: email }
        internalNotes: { type: string }
    UpdateOrganisation:
      allOf:
        - { $ref: '#/components/schemas/CreateOrganisation' }
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, minimum: 1 }
            reason: { type: string }
    OrganisationStatusChange:
      type: object
      required: [expectedVersion, status, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, UNDER_REVIEW, CLOSED] }
        reason: { type: string, minLength: 1 }
    CreateConsentReview:
      type: object
      additionalProperties: false
      required: [organisationId, name, channel, consentSource, scope]
      properties:
        organisationId: { type: string, format: uuid }
        scope: { type: string, enum: [ORGANISATION, SOURCE, CAMPAIGN] }
        campaignId: { type: string, format: uuid }
        sourceSystem: { type: string }
        name: { type: string }
        purposeDescription: { type: string }
        purposeCode: { type: string }
        channel: { type: string, enum: [WHATSAPP] }
        consentSource: { type: string }
        collectionMethod: { type: string }
        collectionPeriodFrom: { type: string, format: date-time }
        collectionPeriodTo: { type: string, format: date-time }
        controllerRole: { type: string }
        wordingVersion: { type: string }
        exactConsentWording: { type: string }
        privacyNoticeVersion: { type: string }
        evidenceAssetIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        externalEvidenceReferences:
          type: array
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [reference, sha256Checksum]
            properties:
              reference: { type: string, minLength: 1, maxLength: 1000 }
              sha256Checksum: { type: string, pattern: '^[0-9a-f]{64}$' }
        privacyNoticeReviewed: { type: boolean }
        optOutProcessReviewed: { type: boolean }
        sampleRecordsReviewed: { type: boolean }
        sampleReviewNotes: { type: string, maxLength: 2000, description: Aggregate review notes only; must not contain sample MSISDNs or email addresses. }
        permittedCountries: { type: array, uniqueItems: true, items: { type: string, minLength: 2, maxLength: 2 } }
        permittedMessageCategory: { type: string }
        permittedPartnerOrganisations: { type: array, uniqueItems: true, items: { type: string } }
        restrictions: { type: string }
    ConsentReviewDecision:
      type: object
      additionalProperties: false
      required: [decision, expectedVersion, reason]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        approvedWithRestrictions: { type: boolean }
        expiresAt: { type: string, format: date-time }
        nextReviewAt: { type: string, format: date-time }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 5 }
    SenderLifecycleAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 8 }
    TransportSelectionRequest:
      type: object
      additionalProperties: false
      required:
        [channel, provider, engine, routingMode, gatewayPoolId, adapterVersion, fallbackMode, routingPolicyVersion, capacityEvidenceVersion]
      properties:
        channel: { type: string, enum: [WHATSAPP] }
        provider: { type: string, enum: [OPENWA] }
        engine: { type: string, enum: [WHATSAPP_WEB_JS, BAILEYS] }
        routingMode: { type: string, enum: [SPECIFIC_SESSION, SENDER_POOL] }
        gatewayPoolId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        senderPoolId: { type: string, format: uuid }
        adapterVersion: { type: string, minLength: 1, maxLength: 100 }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [SEND_TEXT, SEND_IMAGE, SEND_VIDEO, SEND_DOCUMENT, DELIVERY_EVENTS, READ_EVENTS, INBOUND_MESSAGES]
        fallbackMode: { type: string, enum: [NONE] }
        routingPolicyVersion: { type: string, minLength: 1, maxLength: 100 }
        capacityEvidenceVersion: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { routingMode: { const: SPECIFIC_SESSION } }
          then:
            required: [sessionId]
            not: { required: [senderPoolId] }
        - if:
            properties: { routingMode: { const: SENDER_POOL } }
          then:
            required: [senderPoolId]
            not: { required: [sessionId] }
    CreateCampaign:
      type: object
      additionalProperties: false
      required:
        [organisationId, name, purposeId, consentReviewId, maximumUniqueRecipients, transport]
      properties:
        organisationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 250 }
        purposeId: { type: string, format: uuid }
        consentReviewId: { type: string, format: uuid }
        requestedStartAt: { type: string, format: date-time }
        completionDeadlineAt: { type: string, format: date-time }
        timezone: { type: string, default: UTC }
        quietHoursStart: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        quietHoursEnd: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        maximumUniqueRecipients: { type: integer, format: int64, minimum: 1 }
        maximumMessagesPerRecipient: { type: integer, enum: [1], default: 1 }
        senderPool: { type: string, description: Legacy display label; governed routing uses transport.senderPoolId. }
        transport: { $ref: '#/components/schemas/TransportSelectionRequest' }
    CampaignMaterialAmendment:
      type: object
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1 }
        changeSchedule: { type: boolean }
        requestedStartAt: { type: string, format: date-time }
        completionDeadlineAt: { type: string, format: date-time }
        changeAudience: { type: boolean }
        audienceSnapshotId: { type: string, format: uuid }
        changeMessage: { type: boolean }
        messageVersionId: { type: string, format: uuid }
        changeTransport: { type: boolean }
        transport: { type: object, additionalProperties: true }
        changeEntitlement: { type: boolean }
        maximumUniqueRecipients: { type: integer, format: int64, minimum: 1 }
    OperationalJobAction:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 8, maxLength: 1000 }
    CampaignTransition:
      type: object
      required: [action, actorId]
      properties:
        action:
          type: string
          enum:
            [SUBMIT_CONSENT_REVIEW, APPROVE_CONSENT, START_AUDIENCE_BUILD, VALIDATE_AUDIENCE,
             SUBMIT_MESSAGE, APPROVE_MESSAGE, APPROVE_COMMERCIAL, REQUEST_FINAL_APPROVAL,
             APPROVE_FINAL, START_DISPATCH, PAUSE, RESUME, COMPLETE, CANCEL]
        actorId: { type: string, format: uuid }
        reason: { type: string }
        audienceSnapshotId: { type: string, format: uuid }
        audienceSnapshotHash: { type: string }
        eligibleAudienceCount: { type: integer, format: int64 }
        messageVersionId: { type: string, format: uuid }
        messageBody: { type: string }
        failedCount: { type: integer, format: int64 }
        unknownCount: { type: integer, format: int64 }
