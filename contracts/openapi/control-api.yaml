        sessionCount: { type: integer, minimum: 0, maximum: 10000 }
        queueDepth: { type: integer, format: int64, minimum: 0 }
        cpuPercent: { type: number, minimum: 0, maximum: 100 }
        memoryBytes: { type: integer, format: int64, minimum: 0 }
