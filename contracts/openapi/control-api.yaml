openapi: 3.1.0
info:
  title: Internal Audience & Campaign Control API
  version: 0.8.28
  description: >
    Internal-only API for organisation records, offline consent reviews, secure audience imports,
    governed cohort definitions and controlled campaign lifecycle management.
servers:
  - url: /api/v1
security:
  - internalSession: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an internal user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: MFA challenge or authenticated session }
        '401': { description: Credentials could not be verified }
        '429': { description: Account temporarily locked }
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      summary: Complete the login MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFAVerificationRequest' }
      responses:
        '200': { description: Authenticated session created }
        '401': { description: MFA challenge invalid or expired }
  /auth/step-up:
    post:
      operationId: stepUpMFA
      summary: Refresh MFA assurance for the existing session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpRequest' }
      responses:
        '200': { description: Session MFA assurance refreshed }
        '401': { description: MFA code or session invalid }
  /auth/sessions:
    get:
      operationId: listActiveSessions
      summary: List the current user's active sessions
      responses:
        '200': { description: Active session list }
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllOwnSessions
      summary: Revoke every active session for the current user
      responses:
        '200': { description: All sessions revoked }
  /inbound-replies/{id}/content:
    get:
      operationId: getInboundReplyContent
      summary: Reveal retained inbound reply content under a separate permission
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Retained reply content and retention metadata }
        '410': { description: Content redacted under retention policy }
  /admin/inbound-replies/retention-sweep:
    post:
      operationId: runInboundReplyRetentionSweep
      summary: Redact expired inbound reply content while preserving fingerprints and metrics
      responses:
        '200': { description: Retention sweep result }
  /admin/inbound-retention-policies:
    get:
      operationId: listInboundRetentionPolicies
      summary: List governed effective-dated inbound content retention policies
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Retention policy list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createInboundRetentionPolicy
      summary: Create a draft inbound content retention policy
      responses:
        '201': { description: Draft retention policy created }
  /admin/inbound-retention-policies/{id}/submit:
    post:
      operationId: submitInboundRetentionPolicy
      summary: Submit an inbound retention policy for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Retention policy awaiting approval }
  /admin/inbound-retention-policies/{id}/decision:
    post:
      operationId: decideInboundRetentionPolicy
      summary: Approve or reject a submitted inbound retention policy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Decision recorded }
  /admin/inbound-replies/reencrypt:
    post:
      operationId: reencryptInboundReplyContent
      summary: Schedule a resumable retained-content re-encryption run
      responses:
        '202': { description: Re-encryption run accepted }
  /admin/inbound-reencryption-runs:
    get:
      operationId: listInboundReencryptionRuns
      summary: List resumable inbound-content re-encryption runs
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Re-encryption run list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
  /admin/inbound-reencryption-runs/{id}:
    get:
      operationId: getInboundReencryptionRun
      summary: Read one resumable inbound-content re-encryption run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Re-encryption run }
        '404': { description: Run not found }
  /admin/opt-out-policies:
    get:
      operationId: listOptOutPolicies
      summary: List governed effective-dated opt-out policies
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Policy list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createOptOutPolicy
      summary: Create a draft exact-match opt-out policy
      responses:
        '201': { description: Draft policy created }
  /admin/opt-out-policies/{id}/submit:
    post:
      operationId: submitOptOutPolicy
      summary: Submit an opt-out policy for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Policy awaiting approval }
  /admin/opt-out-policies/{id}/decision:
    post:
      operationId: decideOptOutPolicy
      summary: Approve or reject a submitted opt-out policy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Decision recorded }
  /admin/provider-capabilities:
    get:
      operationId: listProviderCapabilities
      summary: List governed provider and engine capability definitions
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Provider capability definition list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createProviderCapability
      summary: Create a draft provider capability definition
      responses:
        '201': { description: Draft provider capability definition created }
  /admin/provider-capabilities/{id}/submit:
    post:
      operationId: submitProviderCapability
      summary: Submit a provider capability definition for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Provider capability definition awaiting approval }
  /admin/provider-capabilities/{id}/decision:
    post:
      operationId: decideProviderCapability
      summary: Approve or reject a provider capability definition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Provider capability decision recorded }
        '403': { description: Recent MFA step-up required }
  /admin/provider-capabilities/{id}/retire:
    post:
      operationId: retireProviderCapability
      summary: Retire an active provider capability definition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Provider capability definition retired }
        '403': { description: Recent MFA step-up required }
  /admin/provider-capabilities/{id}/events:
    get:
      operationId: listProviderCapabilityEvents
      summary: List append-only provider capability lifecycle events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque cursor returned by the previous page. }
      responses:
        '200':
          description: Provider capability event history
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
        '400': { description: Invalid page limit or cursor }
  /admin/provider-capabilities/resolve:
    post:
      operationId: resolveProviderCapability
      summary: Resolve an active provider and engine definition and verify required capabilities
      responses:
        '200': { description: Active compatible provider capability definition }
        '404': { description: No active provider capability definition matched }
        '422': { description: Required capabilities are not supported }
  /admin/sender-pacing-policies:
    get:
      operationId: listSenderPacingPolicies
      summary: List governed sender pacing policies
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Pacing policy list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createSenderPacingPolicy
      summary: Create a draft sender pacing policy
      responses:
        '201': { description: Draft pacing policy created }
  /admin/sender-pacing-policies/{id}/submit:
    post:
      operationId: submitSenderPacingPolicy
      summary: Submit a sender pacing policy for independent approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pacing policy awaiting approval }
  /admin/sender-pacing-policies/{id}/decision:
    post:
      operationId: decideSenderPacingPolicy
      summary: Approve or reject a submitted sender pacing policy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pacing policy decision recorded }
  /admin/sender-pacing-policies/resolve:
    post:
      operationId: resolveSenderPacingPolicy
      summary: Resolve the effective pacing policy for a provider, engine, pool, session and campaign hierarchy
      responses:
        '200': { description: Effective pacing policy and source versions }
        '404': { description: No active policy matched }
  /admin/users:
    get:
      operationId: listInternalUsers
      summary: List provisioned internal users
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Internal user list
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createInternalUser
      summary: Provision a named internal user
      description: Requires identity.admin permission and recent MFA step-up. Returns the TOTP secret once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInternalUser' }
      responses:
        '201': { description: Internal user provisioned }
        '403': { description: Recent MFA step-up required }
        '409': { description: Email already exists or last-super-admin protection }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/users/{id}:
    put:
      operationId: updateInternalUser
      summary: Update roles, status and MFA policy for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInternalUser' }
      responses:
        '200': { description: Internal user updated }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict or last-super-admin protection }
  /admin/users/{id}/reset-credentials:
    post:
      operationId: resetInternalUserCredentials
      summary: Reset password and MFA enrolment and revoke active sessions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetInternalUserCredentials' }
      responses:
        '200': { description: Credentials reset; TOTP secret returned once }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict }
  /admin/users/{id}/unlock:
    post:
      operationId: unlockInternalUser
      summary: Clear failed-login lock state for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionedAdministrationReason' }
      responses:
        '200': { description: Account unlocked }
        '403': { description: Recent MFA step-up required }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Version conflict }
  /admin/users/{id}/revoke-sessions:
    post:
      operationId: revokeInternalUserSessions
      summary: Revoke every active session for an internal user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrationReason' }
      responses:
        '200': { description: Sessions revoked }
        '403': { description: Recent MFA step-up required }
  /internal/gateway/events:
    post:
      operationId: ingestSignedGatewayEvent
      summary: Ingest one signed provider delivery event
      description: >
        Gateway-only endpoint. The HMAC is calculated over "<unix timestamp>.<exact raw body>".
        Exact replays return the original ledger outcome; event-ID reuse with different evidence is rejected.
      security: []
      parameters:
        - name: X-Gateway-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,}$' }
        - name: X-Gateway-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../events/provider-message-event.schema.json' }
      responses:
        '200': { description: Event applied or accepted as an exact replay }
        '401': { description: Signature missing, invalid or outside the replay window }
        '409': { description: Event identifier reused with different evidence }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Authenticated event was durably queued but correlation is unresolved; gateway must retry the exact event }
  /internal/gateway/inbound:
    post:
      operationId: ingestSignedGatewayInboundMessage
      summary: Ingest one signed inbound reply and enforce recognised opt-outs
      description: >
        Gateway-only endpoint. The HMAC is calculated over "<unix timestamp>.<exact raw body>".
        The control plane resolves the contact from clientReference, applies exact configured STOP classification,
        and creates an idempotent global suppression without persisting non-opt-out message content.
      security: []
      parameters:
        - name: X-Gateway-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10,}$' }
        - name: X-Gateway-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^sha256=[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../events/provider-inbound-message.schema.json' }
      responses:
        '200': { description: Inbound message accepted; response states whether an opt-out was recognised }
        '401': { description: Signature missing, invalid or outside the replay window }
        '404': { description: Campaign recipient reference not found }
        '409': { description: Inbound event identifier reused with different evidence }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assets:
    post:
      operationId: uploadTrustedAsset
      summary: Upload and malware-scan a governed message or evidence asset
      parameters:
        - name: purpose
          in: query
          required: true
          schema: { type: string, enum: [MESSAGE_MEDIA, CONSENT_EVIDENCE, CAMPAIGN_EVIDENCE] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Trusted asset accepted and clean }
        '422': { description: Asset rejected or malware scan failed }
  /assets/{id}:
    get:
      operationId: getTrustedAsset
      summary: Get derived trusted-asset metadata
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Trusted asset metadata }
        '404': { $ref: '#/components/responses/NotFound' }
  /assets/{id}/revoke:
    post:
      operationId: revokeTrustedAsset
      summary: Revoke a trusted asset so it cannot be used by future approvals
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, reason]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 8 }
      responses:
        '200': { description: Asset revoked }
        '403': { description: Recent MFA step-up required }
        '409': { description: Optimistic version conflict }
  /filter-definitions:
    get:
      operationId: listFilterDefinitions
      summary: List active filter definitions available to the current user
      responses:
        '200':
          description: Active filter definitions
  /cohorts/validate:
    post:
      operationId: validateCohort
      summary: Validate a typed cohort definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FilterGroup' }
      responses:
        '200': { description: Valid definition }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cohorts/estimate:
    post:
      operationId: estimateCohort
      summary: Calculate the current eligible audience count for a governed cohort
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileCohortRequest' }
      responses:
        '200':
          description: Cohort estimate returned
          content:
            application/json:
              schema:
                type: object
                required: [eligibleCount, calculatedAt]
                properties:
                  eligibleCount: { type: integer, format: int64, minimum: 0 }
                  breakdown:
                    type: object
                    additionalProperties: false
                    required: [matchedProfiles, consentEligible, consentExcluded, unsuppressed, suppressionExcluded, eligible, frequencyCapExcluded]
                    properties:
                      matchedProfiles: { type: integer, format: int64, minimum: 0 }
                      consentEligible: { type: integer, format: int64, minimum: 0 }
                      consentExcluded: { type: integer, format: int64, minimum: 0 }
                      unsuppressed: { type: integer, format: int64, minimum: 0 }
                      suppressionExcluded: { type: integer, format: int64, minimum: 0 }
                      eligible: { type: integer, format: int64, minimum: 0 }
                      frequencyCapExcluded: { type: integer, format: int64, minimum: 0 }
                  calculatedAt: { type: string, format: date-time }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '422': { description: Cohort could not be estimated }
  /cohort-estimates:
    post:
      operationId: scheduleCohortEstimate
      summary: Schedule a restart-safe governed cohort estimate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCohortEstimateRequest' }
      responses:
        '202':
          description: New durable estimate scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortEstimateJob' }
        '200':
          description: Exact idempotent replay converged on the existing estimate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortEstimateJob' }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '409': { description: Client request ID reused with different content }
        '422': { description: Cohort definition or estimate request rejected }
        '503': { description: Durable cohort estimation unavailable }
    get:
      operationId: listCohortEstimates
      summary: List recoverable cohort estimates for one organisation
      parameters:
        - { name: organisationId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Cohort estimates returned
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CohortEstimateJob' }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
        '400': { description: Missing organisation or invalid pagination request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '503': { description: Durable cohort estimation unavailable }
  /cohort-estimates/{id}:
    get:
      operationId: getCohortEstimate
      summary: Get one durable cohort estimate without exposing worker lease internals
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: organisationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cohort estimate returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortEstimateJob' }
        '400': { description: organisationId is required }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '404': { description: Cohort estimate not found for the organisation }
        '503': { description: Durable cohort estimation unavailable }
  /segments:
    get:
      operationId: listSegments
      summary: List saved governed audience segments
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Opaque continuation token returned by the previous page. }
      responses:
        '200':
          description: Segments returned
          content:
            application/json:
              schema:
                type: object
                required: [items, count, hasMore]
                properties:
                  items: { type: array, items: { type: object } }
                  count: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
                  hasMore: { type: boolean }
    post:
      operationId: createSegment
      summary: Create a saved governed audience segment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSegmentRequest' }
      responses:
        '201': { description: Segment created }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission denied }
        '422': { description: Segment rejected }
  /segments/{id}:
    get:
      operationId: getSegment
      summary: Get a saved audience segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Segment returned }
        '404': { description: Segment not found }
    put:
      operationId: updateSegment
