name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/admin-web/package-lock.json
            services/openwa-gateway/package-lock.json
      - run: npm ci --include=dev --prefix apps/admin-web
      - run: npm ci --include=dev --prefix services/openwa-gateway
      - run: ./scripts/check.sh
