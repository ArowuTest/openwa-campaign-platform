components:
  securitySchemes:
    internalSession:
      type: apiKey
      in: cookie
      name: campaign_session
  responses:
    ValidationError:
      description: Request failed domain or validation rules
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Requested record does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AuthenticatedOperatorContext:
      type: object
      additionalProperties: false
      required: [id, email, displayName, permissions, sessionId, environment, classification, scopeType, organisationIds]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
        sessionId: { type: string }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        environment: { type: string, minLength: 1, maxLength: 64 }
        classification: { type: string, minLength: 1, maxLength: 64 }
        scopeType:
          type: string
          enum: [PLATFORM]
          description: Current identity authority is platform-scoped; organisation-scoped user bindings are not yet implemented.
        organisationIds:
          type: array
          maxItems: 0
          items: { type: string }
          description: Empty while identity authority remains platform-scoped.
    AudienceImportColumnMapping:
      type: object
      additionalProperties: false
      required: [msisdn]
      properties:
        worksheet: { type: string }
        msisdn: { type: string, minLength: 1, maxLength: 250 }
        country: { type: string, maxLength: 250 }
        state: { type: string, maxLength: 250 }
        lga: { type: string, maxLength: 250 }
        age: { type: string, maxLength: 250 }
        gender: { type: string, maxLength: 250 }
    CreateAudienceUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [organisationId, consentReviewId, purposeId, channel, wordingVersion, sourceName, originalFilename, templateVersion, mapping, updatePolicy, expectedBytes]
      properties:
        organisationId: { type: string, format: uuid }
        consentReviewId: { type: string, format: uuid }
        purposeId: { type: string, format: uuid }
        channel: { type: string, enum: [WHATSAPP] }
        wordingVersion: { type: string, minLength: 1, maxLength: 250 }
        sourceName: { type: string, minLength: 1, maxLength: 500 }
        sourceSystem: { type: string, maxLength: 250 }
        defaultCountryIso2: { type: string, pattern: '^[A-Za-z]{2}$' }
        originalFilename: { type: string, minLength: 1, maxLength: 255 }
        templateVersion: { type: string, minLength: 1, maxLength: 250 }
        mappingDefinitionId: { type: string, format: uuid }
        mapping: { $ref: '#/components/schemas/AudienceImportColumnMapping' }
        updatePolicy: { type: string, enum: [INSERT_ONLY, FILL_NULL, NEWEST_SOURCE, TRUSTED_SOURCE, MANUAL_CONFLICT] }
        expectedBytes: { type: integer, format: int64, minimum: 1 }
    AudienceUploadPart:
      type: object
      additionalProperties: false
      required: [number, offset, expectedBytes, state]
      properties:
        number: { type: integer, minimum: 1, maximum: 1024 }
        offset: { type: integer, format: int64, minimum: 0 }
        expectedBytes: { type: integer, format: int64, minimum: 1, maximum: 33554432 }
        state: { type: string, enum: [PENDING, UPLOADED] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        uploadedBytes: { type: integer, format: int64, minimum: 0 }
        uploadedAt: { type: string, format: date-time }
      description: Storage object keys are intentionally not exposed.
    AudienceUploadSession:
      type: object
      additionalProperties: false
      required: [id, organisationId, consentReviewId, purposeId, channel, wordingVersion, sourceName, originalFilename, templateVersion, mapping, updatePolicy, uploadedBy, expectedBytes, uploadedBytes, partSize, partCount, uploadedParts, state, version, expiresAt, createdAt, updatedAt, parts]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        consentReviewId: { type: string, format: uuid }
        purposeId: { type: string, format: uuid }
        channel: { type: string, enum: [WHATSAPP] }
        wordingVersion: { type: string }
        sourceName: { type: string }
        sourceSystem: { type: string }
        defaultCountryIso2: { type: string, pattern: '^[A-Z]{2}$' }
        originalFilename: { type: string }
        templateVersion: { type: string }
        mappingDefinitionId: { type: string, format: uuid }
        mapping: { $ref: '#/components/schemas/AudienceImportColumnMapping' }
        updatePolicy: { type: string, enum: [INSERT_ONLY, FILL_NULL, NEWEST_SOURCE, TRUSTED_SOURCE, MANUAL_CONFLICT] }
        uploadedBy: { type: string, format: uuid }
        expectedBytes: { type: integer, format: int64, minimum: 1 }
        uploadedBytes: { type: integer, format: int64, minimum: 0 }
        partSize: { type: integer, format: int64, minimum: 5242880, maximum: 33554432 }
        partCount: { type: integer, minimum: 1, maximum: 1024 }
        uploadedParts: { type: integer, minimum: 0, maximum: 1024 }
        state: { type: string, enum: [CREATED, UPLOADING, UPLOADED, FINALISING, IMPORT_CREATED, ABORTED, EXPIRED, FAILED] }
        version: { type: integer, format: int64, minimum: 1 }
        failureReason: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        parts:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/AudienceUploadPart' }
      description: Client request keys and storage object keys are never serialized.
    AudienceUploadSessionEnvelope:
      type: object
      additionalProperties: false
      required: [transport, transports, preferredTransport, session]
      properties:
        transport:
          type: string
          enum: [DIRECT_S3, RELAY]
          description: Backward-compatible alias of preferredTransport.
        transports:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [DIRECT_S3, RELAY] }
        preferredTransport: { type: string, enum: [DIRECT_S3, RELAY] }
        session: { $ref: '#/components/schemas/AudienceUploadSession' }
    DirectUploadPartRequest:
      type: object
      additionalProperties: false
      required: [sha256]
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DirectUploadTarget:
      type: object
      additionalProperties: false
      required: [method, url, headers, expectedBytes, expiresAt]
      properties:
        method: { type: string, enum: [PUT] }
        url:
          type: string
          format: uri
          description: Ephemeral one-part upload capability. Never persist or log this value.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Exact signed request headers required by the object store.
        expectedBytes: { type: integer, format: int64, minimum: 1, maximum: 33554432 }
        expiresAt: { type: string, format: date-time }
    AudienceDirectUploadPartTargetEnvelope:
      type: object
      additionalProperties: false
      required: [partNumber, alreadyUploaded]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 1024 }
        alreadyUploaded: { type: boolean }
        target: { $ref: '#/components/schemas/DirectUploadTarget' }
    AudienceUploadPartEnvelope:
      type: object
      additionalProperties: false
      required: [changed, session]
      properties:
        changed: { type: boolean }
        session: { $ref: '#/components/schemas/AudienceUploadSession' }
    UploadSessionVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
    AbortUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 8, maxLength: 1000 }
    MetaSenderDraftRequest:
      type: object
      required: [organisationId, senderPoolId, wabaId, phoneNumberId, displayName, businessPhoneDisplay, credentialKey, graphApiVersion, reason]
      properties:
        organisationId: { type: string }
        senderPoolId: { type: string }
        wabaId: { type: string, minLength: 1 }
        phoneNumberId: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
        businessPhoneDisplay: { type: string, minLength: 1 }
        credentialKey: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$', description: Reference to mounted credentials; never contains the access token or app secret. }
        graphApiVersion: { type: string, pattern: '^v[0-9]{1,3}\.[0-9]{1,2}$' }
        reason: { type: string, minLength: 5 }
    MetaSenderDecisionRequest:
      type: object
      required: [expectedVersion, approve, reason]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        approve: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, minLength: 5 }
    MetaSender:
      type: object
      description: Governed Meta sender metadata. Secret credential values are never serialized.
      required: [id, organisationId, senderPoolId, wabaId, phoneNumberId, displayName, businessPhoneDisplay, credentialKey, graphApiVersion, status, health, version, createdBy, reason, createdAt, updatedAt]
      properties:
        id: { type: string }
        organisationId: { type: string }
        senderPoolId: { type: string }
        wabaId: { type: string }
        phoneNumberId: { type: string }
        displayName: { type: string }
        businessPhoneDisplay: { type: string }
        credentialKey: { type: string, description: Non-secret credential reference key. }
        graphApiVersion: { type: string }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, REJECTED, RETIRED] }
        health: { type: string, enum: [HEALTH_UNKNOWN, HEALTHY, DEGRADED, UNAVAILABLE] }
        healthObservedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        createdBy: { type: string }
        submittedBy: { type: string }
        approvedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MetaSenderVerification:
      type: object
      required: [phoneNumberId, displayPhoneNumber, verifiedName, qualityRating]
      properties:
        phoneNumberId: { type: string }
        displayPhoneNumber: { type: string }
        verifiedName: { type: string }
        qualityRating: { type: string }
    MetaTemplate:
      type: object
      required: [organisationId, wabaId, metaTemplateId, name, language, category, status, components, componentHash, lastSyncedAt]
      properties:
        id: { type: string }
        organisationId: { type: string }
        wabaId: { type: string }
        metaTemplateId: { type: string }
        name: { type: string }
        language: { type: string }
        category: { type: string }
        status: { type: string }
        qualitySignal: { type: string }
        components:
          type: array
          description: Structured Meta template components as synchronized from the Graph API.
          items: { type: object, additionalProperties: true }
        componentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        lastSyncedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
