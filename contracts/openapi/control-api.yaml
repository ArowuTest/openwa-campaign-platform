    post:
      operationId: resolveDeliveryException
      summary: Resolve an unknown or contradictory delivery outcome using reviewed evidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, evidenceRef, reason]
                  properties:
                    action: { type: string, enum: [CONFIRM_SENT, CONFIRM_DELIVERED, CONFIRM_READ, MARK_FAILED_PERMANENT] }
                    evidenceRef: { type: string, minLength: 6 }
                    reason: { type: string, minLength: 8 }
                - type: object
                  additionalProperties: false
                  required: [action, evidenceRef, reason, duplicateRiskAccepted]
                  properties:
                    action: { type: string, enum: [CONFIRM_NOT_SUBMITTED] }
                    evidenceRef: { type: string, minLength: 6 }
                    reason: { type: string, minLength: 8 }
                    duplicateRiskAccepted: { type: boolean, enum: [true], description: Explicit acceptance of the POSSIBLE_DUPLICATE_SEND risk after reviewed evidence shows provider submission did not occur. }
      responses:
        '200': { description: Delivery exception resolved }
        '400': { description: Invalid request }
        '401': { description: Authentication required }
        '403': { description: Permission or MFA step-up required }
        '409': { description: Exception is no longer eligible or retry would create duplicate risk }
