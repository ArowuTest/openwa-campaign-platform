  /webhooks/meta/{credentialKey}:
    get:
      operationId: verifyMetaWebhook
      summary: Complete Meta webhook endpoint verification
      security: []
      parameters:
        - { name: credentialKey, in: path, required: true, schema: { type: string } }
        - { name: hub.mode, in: query, required: true, schema: { type: string, enum: [subscribe] } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string, pattern: '^[0-9]{1,256}$' } }
      responses:
        '200':
          description: Meta challenge echoed after constant-time token verification
          content:
            text/plain: { schema: { type: string } }
        '403': { description: Verification token or challenge rejected }
    post:
      operationId: ingestMetaWebhook
      summary: Authenticate and ingest Meta WhatsApp status and inbound callbacks
      security: []
      parameters:
        - { name: credentialKey, in: path, required: true, schema: { type: string } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string, pattern: '^sha256=[0-9a-fA-F]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Authenticated webhook accepted and normalized }
        '400': { description: Invalid webhook envelope or unreadable body }
        '401': { description: X-Hub signature or credential key invalid }
        '403': { description: WABA/phone sender is not bound to the credential endpoint }
        '409': { description: Callback replay conflicts with immutable prior evidence }
        '413': { description: Webhook exceeds the configured body limit }
