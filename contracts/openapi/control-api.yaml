        scope: { type: string, enum: [CONTAINER] }
        filesystemPath: { type: string }
        diskTotalBytes: { type: integer, format: int64, minimum: 0 }
        diskFreeBytes: { type: integer, format: int64, minimum: 0 }
        diskAvailableBytes: { type: integer, format: int64, minimum: 0 }
        inodesTotal: { type: integer, format: int64, minimum: 0 }
        inodesFree: { type: integer, format: int64, minimum: 0 }
        processId: { type: integer, minimum: 1 }
        processUptimeSeconds: { type: integer, format: int64, minimum: 0 }
        openFileDescriptorCount: { type: integer, format: int64, minimum: 0 }
        networkRxBytes: { type: integer, format: int64, minimum: 0 }
        networkTxBytes: { type: integer, format: int64, minimum: 0 }
        networkInterfaceCount: { type: integer, minimum: 0 }
