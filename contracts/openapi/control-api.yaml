      summary: Read the saved campaign aggregate for an internal platform operator
      description: Requires campaign.read. Historical suspended organisations and retired transport sources remain readable. Does not rebind sources or authorise release. No contacts, credentials, private object keys, workspace notes or financial data are included.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: Canonical UUID of the campaign. }
      responses:
        '200':
          description: Saved campaign aggregate with UTC ISO 8601 timestamps
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
              description: Sensitive operator evidence is never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignDetail' }
        '400':
          description: INVALID_CAMPAIGN_ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: AUTHENTICATION_REQUIRED or SESSION_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: PERMISSION_DENIED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: CAMPAIGN_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Canonical INTERNAL_ERROR without repository details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: CAMPAIGNS_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

