      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAudienceUploadSessionRequest' }
      responses:
        '200':
          description: Existing exact upload session replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceUploadSessionEnvelope' }
        '201':
          description: Upload session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudienceUploadSessionEnvelope' }
        '400': { description: Invalid governed upload request }
        '409': { description: Idempotency key reused with different upload metadata }
        '413': { description: Source exceeds configured upload limit }
        '503': { description: Resumable upload is unavailable }
